# Reusable Python CI: ruff (lint + format check) + tests, on uv.
# Call from a repo:
#   jobs:
#     ci:
#       uses: menarzullayev/.github/.github/workflows/ci-python.yml@main
#       with:
#         python-version: "3.12"
#         env-json: '{"BOT_TOKEN":"x","WEBHOOK_SECRET":"x"}'   # dummy env for import-time config
#         test-command: "pytest -q"                            # default
#
# Works for a repo with pyproject.toml (uv sync), with requirements*.txt, or with neither
# (standard library only). pytest is always installed, so plain unittest suites run too.
name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        default: "3.12"
      run-tests:
        description: Run the tests
        type: boolean
        default: true
      run-lint:
        description: Run ruff
        type: boolean
        default: true
      working-directory:
        description: Directory to run in
        type: string
        default: "."
      env-json:
        description: JSON object of dummy env vars exported for the whole job
        type: string
        default: "{}"
      test-command:
        description: Command that runs the tests inside the job's virtual environment
        type: string
        default: "pytest -q"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Read from an environment variable, never pasted into the script: a quote in a value
      # cannot break out of the command.
      - name: Export dummy env
        if: inputs.env-json != '{}'
        env:
          ENV_JSON: ${{ inputs.env-json }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          for key, value in json.loads(os.environ["ENV_JSON"]).items():
              value = str(value)
              if "\n" in value or not key.replace("_", "").isalnum():
                  raise SystemExit(f"env-json: unusable entry {key!r}")
              print(f"{key}={value}")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: |
          uv venv --python "${{ inputs.python-version }}" .venv
          if [ -f pyproject.toml ]; then
            uv sync --all-extras --dev
          else
            for file in requirements.txt requirements-dev.txt; do
              if [ -f "$file" ]; then uv pip install -r "$file"; fi
            done
          fi
          uv pip install pytest

      - name: Ruff lint
        if: inputs.run-lint
        run: uvx ruff check .

      - name: Ruff format check
        if: inputs.run-lint
        run: uvx ruff format --check .

      - name: Tests
        if: inputs.run-tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          source .venv/bin/activate
          set +e
          bash -c "$TEST_COMMAND"
          code=$?
          # pytest exit 5: no tests were collected; a repo without tests is not a failure.
          if [ "$code" = 5 ] && [ "${TEST_COMMAND%% *}" = pytest ]; then code=0; fi
          exit "$code"
